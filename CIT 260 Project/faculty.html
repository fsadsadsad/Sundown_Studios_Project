<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="styles_faculty.css" rel="stylesheet" type="text/css" />
  <title>CSN — Faculty Exam Edit</title>
</head>
<body>

  <!-- Top blue header bar -->
  <header id="page-header">
    <h1 id="title">Faculty Exam Edit</h1>
  </header>

  <main>

    <!-- LEFT: Exam list + logout -->
    <div id="enrolled-list">

      <h2 id="enrolled-heading">Exam List</h2>

      <!-- Scrollable list of exams — populated by JS on page load -->
      <div id="exam-scroll">
        <p id="no-exams-msg" class="empty-msg">No exams found. Add one using the form on the right.</p>
      </div>

      <!-- Red logout button pinned to bottom of left panel -->
      <div id="logout-wrapper">
        <button type="button" id="logoutbutton" onclick="handleLogout()">Log Out</button>
      </div>

    </div>
    <!-- END #enrolled-list -->

    <!-- RIGHT: Add Exam form -->
    <div id="add-form-card">

      <h2 id="form-heading">Add Exam to List</h2>

      <!-- Subject dropdown (populated from DB) -->
      <div class="form-group">
        <label for="subject-select">Subject</label>
        <select id="subject-select" onchange="onSubjectChange(this.value)">
          <option value="" disabled selected>— Select a subject —</option>
        </select>
      </div>

      <!-- Time and date -->
      <div class="form-row">
        <div class="form-group">
          <label for="exam-time">Time</label>
          <input type="time" id="exam-time" name="time" />
        </div>
        <div class="form-group">
          <label for="exam-date">Date</label>
          <input type="date" id="exam-date" name="date" />
        </div>
      </div>

      <!-- Location (auto-populated, readonly) -->
      <div class="form-group">
        <label for="exam-location">Location</label>
        <input type="text" id="exam-location" name="location"
               placeholder="Select a subject above" readonly />
      </div>

      <!-- Building and room (auto-populated, readonly) -->
      <div class="form-row">
        <div class="form-group">
          <label for="exam-building">Building</label>
          <input type="text" id="exam-building" name="building"
                 placeholder="Auto-populated" readonly />
        </div>
        <div class="form-group">
          <label for="exam-room">Room Number</label>
          <input type="text" id="exam-room" name="room"
                 placeholder="Auto-populated" readonly />
        </div>
      </div>

      <!-- Submit -->
      <div class="form-group">
        <button type="button" id="addbutton" onclick="submitAddExam()">Add Exam to List</button>
      </div>

    </div>
    <!-- END #add-form-card -->

  </main>

  <footer id="page-footer">
    <span>College of Southern Nevada</span>
  </footer>

  <!-- ================================================================
       Modal: Student list for a selected exam
       ================================================================ -->
  <div id="modal-overlay" class="hidden" onclick="handleOverlayClick(event)">
    <div id="modal-box">

      <!-- Modal header: title + action buttons -->
      <div id="modal-header">
        <h3 id="modal-title">Students</h3>
        <div id="modal-header-actions">
          <button type="button" id="modal-add-btn" onclick="showAddStudentView()">+ Add Student</button>
          <button type="button" id="modal-close-btn" onclick="closeModal()">&#x2715;</button>
        </div>
      </div>

      <!-- View 1: Student list -->
      <div id="modal-list-view">
        <div id="modal-student-scroll">
          <p id="no-students-msg" class="empty-msg">No students enrolled in this exam.</p>
        </div>
      </div>

      <!-- View 2: Add student form (hidden until "+ Add Student" is clicked) -->
      <div id="modal-add-view" class="hidden">
        <div id="modal-add-form">
          <button type="button" id="modal-back-btn" onclick="showStudentListView()">&#8592; Back to Students</button>
          <div class="form-group">
            <label for="modal-student-select">Student</label>
            <select id="modal-student-select">
              <option value="" disabled selected>— Select a student —</option>
            </select>
          </div>
          <button type="button" id="modal-confirm-add" onclick="submitAddStudent()">Add to Exam</button>
        </div>
      </div>

    </div>
    <!-- END #modal-box -->
  </div>

  <script>
    const API_BASE = 'http://localhost:5001';
    let currentExamId = null;

    // ── Page load ─────────────────────────────────────────────────────────────

    document.addEventListener('DOMContentLoaded', async () => {
      await Promise.all([loadExams(), loadSubjects()]);
    });

    // ── Left panel: exam list ─────────────────────────────────────────────────

    async function loadExams() {
      try {
        const res  = await fetch(`${API_BASE}/api/faculty/exams`);
        const data = await res.json();
        if (data.success) renderExams(data.exams);
      } catch (e) {
        console.error('Could not load exams:', e);
      }
    }

    function renderExams(exams) {
      const scroll = document.getElementById('exam-scroll');
      const noMsg  = document.getElementById('no-exams-msg');

      scroll.querySelectorAll('.exam-entry').forEach(el => el.remove());

      if (!exams || exams.length === 0) {
        noMsg.classList.remove('hidden');
        return;
      }
      noMsg.classList.add('hidden');

      exams.forEach(ex => {
        const timeStr = formatTime(ex.time);
        const dateStr = formatDate(ex.date);
        const locParts = [
          ex.location || '',
          ex.building ? `Bldg ${ex.building}` : '',
          ex.room     ? `Room ${ex.room}`     : ''
        ].filter(Boolean);
        const locStr = locParts.join(' · ');
        const count  = ex.enrollment ?? 0;

        const entry = document.createElement('div');
        entry.className = 'exam-entry';
        entry.dataset.examId = ex.ExamID;
        entry.innerHTML = `
          <div class="exam-info">
            <span class="exam-name">${escHtml(ex.subject)} Exam</span>
            <span class="exam-detail">${escHtml(dateStr)} at ${escHtml(timeStr)}</span>
            ${locStr ? `<span class="exam-detail">${escHtml(locStr)}</span>` : ''}
            <span class="exam-detail exam-enrollment">${count} student${count !== 1 ? 's' : ''} enrolled</span>
          </div>
          <button type="button" class="view-btn"
                  data-exam-id="${ex.ExamID}"
                  data-subject="${escAttr(ex.subject)}">
            View Students
          </button>
        `;
        entry.querySelector('.view-btn').addEventListener('click', () => {
          openModal(ex.ExamID, ex.subject);
        });
        scroll.appendChild(entry);
      });
    }

    // ── Right panel: add exam ─────────────────────────────────────────────────

    async function loadSubjects() {
      try {
        const res  = await fetch(`${API_BASE}/api/faculty/subjects`);
        const data = await res.json();
        if (!data.success) return;
        const sel = document.getElementById('subject-select');
        data.subjects.forEach(s => {
          const opt = document.createElement('option');
          opt.value       = s.ClassID;
          opt.textContent = s.ClassName;
          opt.dataset.name = s.ClassName;
          sel.appendChild(opt);
        });
      } catch (e) {
        console.error('Could not load subjects:', e);
      }
    }

    async function onSubjectChange(classId) {
      if (!classId) return;
      try {
        const res  = await fetch(`${API_BASE}/api/faculty/subjects/${classId}/location`);
        const data = await res.json();
        const loc  = data.success && data.location ? data.location : null;
        document.getElementById('exam-location').value = loc ? (loc.location || '') : '';
        document.getElementById('exam-building').value = loc ? (loc.building || '') : '';
        document.getElementById('exam-room').value     = loc ? (loc.room     || '') : '';
      } catch (e) {
        console.error('Could not load location for subject:', e);
      }
    }

    async function submitAddExam() {
      const sel        = document.getElementById('subject-select');
      const classId    = sel.value;
      const subjectName = sel.options[sel.selectedIndex]?.dataset.name || sel.options[sel.selectedIndex]?.text || '';
      const time       = document.getElementById('exam-time').value;
      const date       = document.getElementById('exam-date').value;
      const location   = document.getElementById('exam-location').value.trim();
      const building   = document.getElementById('exam-building').value.trim();
      const room       = document.getElementById('exam-room').value.trim();

      if (!classId || !time || !date) {
        alert('Please select a subject and fill in the time and date.');
        return;
      }

      try {
        const res  = await fetch(`${API_BASE}/api/faculty/exams`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ subject: subjectName, date, time, location, building, room })
        });
        const data = await res.json();
        if (data.success) {
          sel.selectedIndex = 0;
          document.getElementById('exam-time').value     = '';
          document.getElementById('exam-date').value     = '';
          document.getElementById('exam-location').value = '';
          document.getElementById('exam-building').value = '';
          document.getElementById('exam-room').value     = '';
          await loadExams();
        } else {
          alert('Error: ' + data.message);
        }
      } catch (e) {
        alert('Failed to add exam. Is the server running on port 5001?');
        console.error(e);
      }
    }

    // ── Modal ─────────────────────────────────────────────────────────────────

    async function openModal(examId, subjectName) {
      currentExamId = examId;
      document.getElementById('modal-title').textContent = `Students — ${subjectName} Exam`;
      showStudentListView();
      document.getElementById('modal-overlay').classList.remove('hidden');
      await Promise.all([loadModalStudents(examId), loadUsers()]);
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
      currentExamId = null;
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('modal-overlay')) closeModal();
    }

    function showAddStudentView() {
      document.getElementById('modal-list-view').classList.add('hidden');
      document.getElementById('modal-add-view').classList.remove('hidden');
    }

    function showStudentListView() {
      document.getElementById('modal-add-view').classList.add('hidden');
      document.getElementById('modal-list-view').classList.remove('hidden');
    }

    async function loadModalStudents(examId) {
      const scroll = document.getElementById('modal-student-scroll');
      const noMsg  = document.getElementById('no-students-msg');
      scroll.querySelectorAll('.modal-student-entry').forEach(el => el.remove());

      try {
        const res  = await fetch(`${API_BASE}/api/faculty/exams/${examId}/students`);
        const data = await res.json();
        if (!data.success) return;

        if (data.students.length === 0) {
          noMsg.classList.remove('hidden');
          return;
        }
        noMsg.classList.add('hidden');

        data.students.forEach(s => {
          const entry = document.createElement('div');
          entry.className = 'modal-student-entry';
          entry.dataset.userId = s.user_id;
          entry.innerHTML = `
            <span class="modal-student-email">${escHtml(s.email)}</span>
            <button type="button" class="kick-btn">Remove</button>
          `;
          entry.querySelector('.kick-btn').addEventListener('click', () => {
            removeStudent(s.user_id, s.email);
          });
          scroll.appendChild(entry);
        });
      } catch (e) {
        console.error('Could not load students:', e);
      }
    }

    async function loadUsers() {
      try {
        const res  = await fetch(`${API_BASE}/api/faculty/users`);
        const data = await res.json();
        if (!data.success) return;
        const sel = document.getElementById('modal-student-select');
        while (sel.options.length > 1) sel.remove(1);
        data.users.forEach(u => {
          const opt = document.createElement('option');
          opt.value       = u.id;
          opt.textContent = u.email;
          sel.appendChild(opt);
        });
      } catch (e) {
        console.error('Could not load users:', e);
      }
    }

    async function removeStudent(userId, email) {
      if (!confirm(`Remove ${email} from this exam?\n\nThis action cannot be undone.`)) return;
      try {
        const res  = await fetch(`${API_BASE}/api/faculty/exams/${currentExamId}/students/${userId}`, {
          method: 'DELETE'
        });
        const data = await res.json();
        if (data.success) {
          const entry = document.querySelector(`.modal-student-entry[data-user-id="${userId}"]`);
          if (entry) entry.remove();
          if (!document.querySelector('.modal-student-entry')) {
            document.getElementById('no-students-msg').classList.remove('hidden');
          }
          await loadExams();
        } else {
          alert('Error: ' + data.message);
        }
      } catch (e) {
        alert('Failed to remove student. Is the server running on port 5001?');
        console.error(e);
      }
    }

    async function submitAddStudent() {
      const sel    = document.getElementById('modal-student-select');
      const userId = sel.value;
      if (!userId) {
        alert('Please select a student.');
        return;
      }
      try {
        const res  = await fetch(`${API_BASE}/api/faculty/exams/${currentExamId}/students`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ user_id: parseInt(userId, 10) })
        });
        const data = await res.json();
        if (data.success) {
          sel.selectedIndex = 0;
          showStudentListView();
          await loadModalStudents(currentExamId);
          await loadExams();
        } else {
          alert('Error: ' + data.message);
        }
      } catch (e) {
        alert('Failed to add student. Is the server running on port 5001?');
        console.error(e);
      }
    }

    // ── Logout ────────────────────────────────────────────────────────────────

    async function handleLogout() {
      try {
        await fetch(`${API_BASE}/api/faculty/logout`, { method: 'POST' });
      } catch (e) { /* ignore network errors on logout */ }
      window.location.href = 'login.html';
    }

    // ── Utilities ─────────────────────────────────────────────────────────────

    function formatTime(t) {
      if (!t) return '';
      const [h, m] = t.split(':');
      const hour = parseInt(h, 10);
      return `${hour % 12 || 12}:${m} ${hour >= 12 ? 'PM' : 'AM'}`;
    }

    function formatDate(d) {
      if (!d) return '';
      const [y, mo, day] = d.split('-');
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${months[parseInt(mo, 10) - 1]} ${parseInt(day, 10)}, ${y}`;
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function escAttr(str) {
      return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
  </script>

</body>
</html>
